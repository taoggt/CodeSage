[project]
name = "codesage"
version = "0.1.0"
description = "AI 代码审查 Agent（CLI）：确定性静态分析 + 自研 ReAct 内核"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CodeSage" }]
keywords = ["code-review", "agent", "llm", "static-analysis", "cli"]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0",
    "ruff>=0.6.0",
    "bandit>=1.7.9",
    "radon>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-mock>=3.14.0"]

[project.scripts]
codesage = "codesage.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codesage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
